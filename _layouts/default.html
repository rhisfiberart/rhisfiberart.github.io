<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
      <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        <span>Menu</span>
        <svg class="nav-toggle-icon" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true" focusable="false"><path d="M4 7l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <nav class="site-nav" id="site-nav">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a>
        <a href="{{ '/gallery/' | relative_url }}" {% if page.url contains '/gallery' %}class="active"{% endif %}>Gallery</a>
        <a href="{{ '/portfolio/' | relative_url }}" {% if page.url contains '/portfolio' %}class="active"{% endif %}>Portfolio</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>{{ site.author.name }}, {{ site.author.bio }}</p>
      <p>Contact me at <a href="mailto:info@rhisfiberart.com">info@rhisfiberart.com</a></p>
      <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
    </div>
  </footer>

  <script>
    // Mobile page menu: the button opens/closes the dropdown (phones only; CSS hides the button on wider screens)
    (function () {
      var btn = document.querySelector('.nav-toggle');
      var header = document.querySelector('.site-header');
      if (!btn || !header) return;
      function setOpen(open) {
        header.classList.toggle('nav-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      btn.addEventListener('click', function () {
        setOpen(!header.classList.contains('nav-open'));
      });
      document.addEventListener('click', function (e) {
        if (!header.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { setOpen(false); }
      });
    })();
  </script>

</body>
</html>
